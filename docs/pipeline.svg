<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="960" height="330" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <text x="30" y="38" font-size="18" font-weight="700" fill="#1f2328">Issue to production, with a person at every gate</text>
  <g font-size="13" fill="#1f2328" text-anchor="middle">
    <g><rect x="30" y="80" width="150" height="86" rx="10" fill="#ddf4ff" stroke="#54aeff"/><text x="105" y="108" font-weight="700">Issue</text><text x="105" y="128" font-size="11.5" fill="#57606a">triage: where, who,</text><text x="105" y="144" font-size="11.5" fill="#57606a">which tests, can an</text><text x="105" y="160" font-size="11.5" fill="#57606a">agent try?</text></g>
    <g><rect x="215" y="80" width="150" height="86" rx="10" fill="#fff8c5" stroke="#d4a72c"/><text x="290" y="108" font-weight="700">Fixer</text><text x="290" y="128" font-size="11.5" fill="#57606a">drafts a fix; opens a</text><text x="290" y="144" font-size="11.5" fill="#57606a">draft PR only if the</text><text x="290" y="160" font-size="11.5" fill="#57606a">failing tests now pass</text></g>
    <g><rect x="400" y="80" width="170" height="86" rx="10" fill="#ffebe9" stroke="#ff8182"/><text x="485" y="108" font-weight="700">Pull request</text><text x="485" y="128" font-size="11.5" fill="#57606a">CI + Skeptic tries to break it</text><text x="485" y="144" font-size="11.5" fill="#57606a">gate decides the approval level</text><text x="485" y="160" font-size="11.5" fill="#57606a">Reporter: what you must decide</text></g>
    <g><rect x="605" y="80" width="150" height="86" rx="10" fill="#dafbe1" stroke="#4ac26b"/><text x="680" y="108" font-weight="700">Release</text><text x="680" y="128" font-size="11.5" fill="#57606a">build, run, smoke test,</text><text x="680" y="144" font-size="11.5" fill="#57606a">publish the image</text></g>
    <g><rect x="790" y="80" width="140" height="86" rx="10" fill="#f6f8fa" stroke="#8c959f"/><text x="860" y="108" font-weight="700">Monitor</text><text x="860" y="128" font-size="11.5" fill="#57606a">smoke test every</text><text x="860" y="144" font-size="11.5" fill="#57606a">hour</text></g>
  </g>
  <g stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M180,123 L213,123"/><path d="M365,123 L398,123"/><path d="M570,123 L603,123"/><path d="M755,123 L788,123"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#8250df" font-weight="600">
    <circle cx="197" cy="64" r="9" fill="#fbefff" stroke="#8250df"/><text x="197" y="68" font-size="10">P</text><text x="197" y="52">adds the label</text>
    <circle cx="587" cy="64" r="9" fill="#fbefff" stroke="#8250df"/><text x="587" y="68" font-size="10">P</text><text x="587" y="52">reviews and merges</text>
  </g>
  <path d="M860,168 L860,206 L105,206 L105,168" stroke="#cf222e" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="482" y="199" text-anchor="middle" font-size="11.5" fill="#cf222e">a failing check opens an incident issue, which starts triage again</text>
  <rect x="30" y="232" width="900" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="480" y="257" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2328">FalkorDB behind every step</text>
  <text x="480" y="277" text-anchor="middle" font-size="12" fill="#57606a">code graph (calls, imports, which test ran which function)  ·  git history (who changed what, what moves together)</text>
  <text x="480" y="294" text-anchor="middle" font-size="12" fill="#57606a">memory of earlier attempts  ·  every agent action as a hash-chained record you can walk</text>
</svg>
