<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="960" height="300" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="30" y="36" font-size="17" font-weight="700" fill="#1f2328">Measured on 12 real Flask issues, replayed at the parent of the real fix</text>
  <text x="30" y="62" font-size="13.5" font-weight="700" fill="#1f2328">Which tests to run (share of the real fix's test files reached)</text>
  <g font-size="12.5" fill="#1f2328">
    <text x="30" y="92">graph (coverage x calls)</text><rect x="260" y="78" width="528" height="20" rx="4" fill="#2da44e"/><text x="798" y="93" font-weight="700">88%</text>
    <text x="30" y="122">same-named test file</text><rect x="260" y="108" width="228" height="20" rx="4" fill="#8c959f"/><text x="498" y="123" font-weight="700">38%</text>
  </g>
  <text x="30" y="170" font-size="13.5" font-weight="700" fill="#1f2328">Where to edit (real fix's file in the top 3)</text>
  <g font-size="12.5" fill="#1f2328">
    <text x="30" y="200">graph</text><rect x="260" y="186" width="550" height="20" rx="4" fill="#bf8700"/><text x="820" y="201" font-weight="700">11 / 12</text>
    <text x="30" y="230">keyword baseline</text><rect x="260" y="216" width="550" height="20" rx="4" fill="#8c959f"/><text x="820" y="231" font-weight="700">11 / 12</text>
  </g>
  <text x="30" y="270" font-size="12.5" fill="#57606a">A tie on finding the file. The graph earns its place on what comes next: the blast radius and which tests to run.</text>
</svg>
