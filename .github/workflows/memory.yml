name: memory

# When a PR is closed, record what happened to it (merged or rejected) so the next analysis can recall it.
# Memory is a plain JSONL file on the keel-memory branch: auditable and diffable.
on:
  pull_request:
    types: [closed]
    paths: ["demo-app/**"]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: keel-memory

jobs:
  record:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # a closed, unmerged PR has no merge ref to check out
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: prepare the memory branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir mem && cd mem && git init -q
          git config user.name "keel-bot" && git config user.email "keel-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch --depth=1 origin keel-memory; then git checkout -q -b keel-memory FETCH_HEAD; else git checkout -q --orphan keel-memory; fi
      - name: record
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ github.event.pull_request.merged && 'merged' || 'rejected' }}
        run: python -m keel.memory_cli record --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}" --outcome "$OUTCOME" --file mem/memory.jsonl --ledger mem/ledger.jsonl
      - name: push
        working-directory: mem
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          [ -f memory.jsonl ] || { echo "nothing to record"; exit 0; }
          python -m keel.ledger verify --file ledger.jsonl | tee -a "$GITHUB_STEP_SUMMARY"
          echo "ledger head: $(tail -n1 ledger.jsonl | python -c 'import sys,json; print(json.loads(sys.stdin.read())["hash"])')" | tee -a "$GITHUB_STEP_SUMMARY"
          git add memory.jsonl ledger.jsonl
          git diff --cached --quiet && exit 0
          git commit -qm "record PR ${{ github.event.pull_request.number }}: ${{ github.event.pull_request.merged && 'merged' || 'rejected' }}"
          for i in 1 2 3; do
            git push origin keel-memory && exit 0
            git fetch --depth=1 origin keel-memory && git rebase FETCH_HEAD || true
          done
          exit 1
