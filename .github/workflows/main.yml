name: main

# After a human merges: build the image, run it, smoke test it, publish it. Every hour: build from main and smoke test again.
on:
  push:
    branches: [main]
    paths: ["demo-app/**", "scripts/smoke.sh", ".github/workflows/main.yml"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shortener:main demo-app
      - name: run and smoke
        run: |
          docker run -d --name app -p 8080:8080 shortener:main
          for i in $(seq 1 20); do curl -fsS localhost:8080/health >/dev/null && break || sleep 1; done
          ./scripts/smoke.sh http://localhost:8080

  # Not on the hourly schedule: that run is the smoke job only.
  release:
    needs: smoke
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr 'A-Z' 'a-z')-demo
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" demo-app
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
