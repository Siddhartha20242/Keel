name: main

# After a human merges: build the image, run it, smoke test it, publish it. Every hour: build from main and smoke test again.
on:
  push:
    branches: [main]
    paths: ["demo-app/**", "scripts/smoke.sh", ".github/workflows/main.yml"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shortener:main demo-app
      - name: run and smoke
        run: |
          docker run -d --name app -p 8080:8080 shortener:main
          for i in $(seq 1 20); do curl -fsS localhost:8080/health >/dev/null && break || sleep 1; done
          ./scripts/smoke.sh http://localhost:8080

  # Monitor -> issue: a failing smoke check opens one incident issue (and does not repeat it while one is open).
  incident:
    needs: smoke
    if: ${{ always() && needs.smoke.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: open an incident issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create keel:incident --repo "${{ github.repository }}" --force --color b60205
          if [ -z "$(gh issue list --repo "${{ github.repository }}" --label keel:incident --state open --json number --jq '.[0].number')" ]; then
            gh issue create --repo "${{ github.repository }}" --label keel:incident \
              --title "Smoke check failing on main" \
              --body "The post-merge or hourly smoke test failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

  # Not on the hourly schedule: that run is the smoke job only.
  release:
    needs: smoke
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr 'A-Z' 'a-z')-demo
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" demo-app
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
